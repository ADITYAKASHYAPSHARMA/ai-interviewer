[project]
name = "aiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aadigotissues", email = "aadigotissues@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter-core>=5.9.1",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "nbformat>=5.11.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
aiagent = "aiagent:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
